<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>SuperApp Notes</title>
  <meta name="description" content="Offline-first Markdown notes organised into life sections, with archive, trash and Google Drive backup.">
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply a forced theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('theme'));
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <aside id="drawer" class="drawer" aria-label="Navigation"></aside>
    <div id="scrim" class="scrim" hidden></div>
    <main id="view" class="view"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"></dialog>
  <noscript>This app needs JavaScript enabled.</noscript>
</body>
</html>
